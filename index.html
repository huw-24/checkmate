<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Record</title>
  <link rel="stylesheet" href="style_revised.css">
  <link rel="stylesheet" href="style_poster.css">
  <link rel="stylesheet" href="style_reference_5120.css">
</head>

<body>
  <button id="b1ConnectButton" class="b1-connect" type="button">CONNECT B1</button>
  <div id="b1Status" class="b1-status" aria-live="polite">B1 NOT CONNECTED</div>

  <div id="deviceGate" class="device-gate" role="dialog" aria-modal="true" aria-labelledby="deviceGateTitle">
    <div class="device-gate-panel">
      <div class="device-gate-eyebrow">MATCH RECORD / SYSTEM CHECK</div>
      <h1 id="deviceGateTitle">CONNECT DEVICES</h1>
      <p id="deviceGateMessage" role="status">프린터와 마이크를 연결해야 시작할 수 있습니다.</p>
      <button id="deviceGateButton" type="button">CONNECT DEVICES <span aria-hidden="true">↗</span></button>
      <div class="device-gate-status"><span id="printerGateStatus">● PRINTER · OFFLINE</span><span id="micGateStatus">● MICROPHONE · OFFLINE</span></div>
    </div>
  </div>
  <main class="page">
    <div class="top-rule"></div>
    <!-- poster decor -->
    <span class="star s1">*</span><span class="star s2">*</span><span class="star s3">*</span>
    <span class="xbox"></span>
    <div class="pulse" id="pulse" role="button" tabindex="0" aria-pressed="false" aria-label="마이크 켜기" title="클릭하여 마이크 연결"><canvas id="pulseCanvas" width="720" height="180" aria-hidden="true"></canvas><span class="mic-indicator" id="micIndicator">MIC OFF · CLICK TO ENABLE</span></div>

    <div class="workspace">
      <!-- LEFT : BOARD -->
      <section class="board-section">
        <div class="board-wrap">
          <div id="boardHeading" class="board-heading"></div>
          <div class="ranks">
            <span>A</span><span>B</span><span>C</span><span>D</span>
            <span>E</span><span>F</span><span>G</span><span>H</span>
          </div>

          <div id="chessBoard" class="chess-board"></div>

          <div class="files">
            <span>1</span><span>2</span><span>3</span><span>4</span>
            <span>5</span><span>6</span><span>7</span><span>8</span>
          </div>
        </div>

        <div class="players">
          <div class="player white">White :: <span>ME</span></div>
          <div class="player black">Black :: <span> ~ </span></div>
        </div>
      </section>

      <!-- RIGHT : GAME INFO + RECORD -->
      <section class="record-section">
        <div class="game-info">
          <div class="timer-box">
            <div class="box-tab">Time</div>
            <div class="timer" id="timer">0.0</div>
            <div class="seconds" id="timerUnit">min</div>
          </div>

          <div class="captured-box">
            <div class="box-tab">Captured Pieces</div>
            <div class="captured-side" id="capturedWhite"></div>
            <div class="captured-side black-captured" id="capturedBlack"></div>
          </div>
        </div>

        <section class="record">
          <div class="record-title">MOVE LIST</div>

          <!--
            각 행이 "기보 + 질문 + 답변" 한 단위입니다.
            별도의 현재 질문 패널을 두지 않습니다.
          -->
          <div id="moveList" class="move-list"></div>

          <div class="record-footer">
            <span id="progress">0 / 10</span>
            <span>ENTER : NEXT MOVE</span>
          </div>
        </section>
      </section>
    </div>
  </main>

  <!-- NIIMBOT B1 Web Bluetooth driver (MIT, validated on B1). Internet is required to load this file. -->
  <script src="https://cdn.jsdelivr.net/gh/iscarelli/niimbot-web-bluetooth@main/src/niimbot.js"></script>
  <script src="script_revised.js"></script>
  <script src="pulse_microphone.js"></script>
</body>

</html>
